[package]
name = "novossh-desktop"
version = "1.0.0"
description = "NovoSSH - SSH Terminal Client"
authors = ["Novo Consulting Services Inc."]
license = "MIT"
repository = "https://github.com/incnovoconsulting-cpu/NovoSSH"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
ssh2 = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
dirs = "5.0"
uuid = { version = "1.0", features = ["v4"] }
