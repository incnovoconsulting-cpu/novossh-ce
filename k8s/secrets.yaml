apiVersion: v1
kind: Secret
metadata:
  name: novossh-secrets
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # PostgreSQL connection string
  # Format: postgresql://user:password@host:5432/dbname?sslmode=require
  DATABASE_URL: "postgresql://novossh:CHANGE_ME@postgres-service:5432/novossh?sslmode=require"

  # Tailscale OAuth credentials
  TAILSCALE_CLIENT_ID: "tskey-client-CHANGE_ME"
  TAILSCALE_CLIENT_SECRET: "tskey-secret-CHANGE_ME"

  # Tailscale IP address (optional)
  TAILSCALE_IP_ADDRESS: ""

  # Session secret for Express
  SESSION_SECRET: "CHANGE_ME_RANDOM_32_CHARS"

  # JWT secret for authentication
  JWT_SECRET: "CHANGE_ME_RANDOM_32_CHARS"
