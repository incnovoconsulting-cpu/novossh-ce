---
# Storage Class for Database Backups (fast SSD)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: novossh-fast-ssd
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: storage
provisioner: ebs.csi.aws.amazon.com
allowVolumeExpansion: true
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"
  kms: "arn:aws:kms:us-east-1:ACCOUNT_ID:key/KEY_ID"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---
# Storage Class for Logs (optimized for sequential access)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: novossh-logs
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: storage
provisioner: ebs.csi.aws.amazon.com
allowVolumeExpansion: true
parameters:
  type: sc1
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---
# Persistent Volume for Database Backups
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: novossh-backups-pvc
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: backup
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: novossh-fast-ssd
  resources:
    requests:
      storage: 500Gi

---
# Persistent Volume for Application Logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: novossh-logs-pvc
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: logging
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: novossh-logs
  resources:
    requests:
      storage: 1Ti

---
# Persistent Volume for Prometheus Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-pvc
  namespace: novossh
  labels:
    app.kubernetes.io/name: prometheus
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: novossh-fast-ssd
  resources:
    requests:
      storage: 100Gi

---
# Persistent Volume for Grafana Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-pvc
  namespace: novossh
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: novossh-fast-ssd
  resources:
    requests:
      storage: 10Gi

---
# Persistent Volume for Elasticsearch Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data-pvc
  namespace: novossh
  labels:
    app.kubernetes.io/name: elasticsearch
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: novossh-fast-ssd
  resources:
    requests:
      storage: 500Gi

---
# Snapshot for Backup and Recovery
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: novossh-snapshot-class
  labels:
    app.kubernetes.io/name: novossh
driver: ebs.csi.aws.amazon.com
deletionPolicy: Delete

---
# Volume Snapshot for Database Backups (daily)
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: novossh-backup-daily
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    backup-type: daily
spec:
  volumeSnapshotClassName: novossh-snapshot-class
  source:
    persistentVolumeClaimName: novossh-backups-pvc
