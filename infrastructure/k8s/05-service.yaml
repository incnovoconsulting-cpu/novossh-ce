---
# Service for NovoSSH API Server
apiVersion: v1
kind: Service
metadata:
  name: novossh-api
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: api
  ports:
  - name: http
    port: 80
    targetPort: 8787
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# Service for NovoSSH Web Frontend
apiVersion: v1
kind: Service
metadata:
  name: novossh-web
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: web
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

---
# Headless Service for API (for StatefulSet communication if needed)
apiVersion: v1
kind: Service
metadata:
  name: novossh-api-headless
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: api
  ports:
  - name: http
    port: 8787
    targetPort: 8787
    protocol: TCP

---
# Service for Prometheus
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: novossh
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP

---
# Service for Grafana
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: novossh
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP

---
# Service for AlertManager
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: novossh
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
  - name: http
    port: 9093
    targetPort: 9093
    protocol: TCP
