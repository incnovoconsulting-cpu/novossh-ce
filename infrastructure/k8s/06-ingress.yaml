---
# Ingress Controller for NovoSSH (Nginx)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novossh-main
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
  annotations:
    # Nginx Ingress Controller annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://novossh.example.com,https://app.novossh.example.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Request-ID"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "1000"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none';";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";

    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "novossh-api"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # Proxy configuration
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

    # Certificate management (cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: "http01"

spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - novossh.example.com
    - api.novossh.example.com
    - app.novossh.example.com
    - monitoring.novossh.example.com
    secretName: novossh-tls-cert

  rules:
  # Web Frontend
  - host: novossh.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: novossh-web
            port:
              number: 80

  - host: app.novossh.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: novossh-web
            port:
              number: 80

  # API Server
  - host: api.novossh.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: novossh-api
            port:
              number: 80

  # Monitoring (Grafana)
  - host: monitoring.novossh.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000

---
# Certificate Issuer (Let's Encrypt Production)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@novossh.example.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx
    - dns01:
        cloudflare:
          email: ops@novossh.example.com
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token

---
# Certificate Issuer (Let's Encrypt Staging - for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: cert-manager
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@novossh.example.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Network Policy for API Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: novossh-api-netpol
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: novossh
      app.kubernetes.io/component: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from Ingress Controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8787
  # Allow from same namespace (for metrics scraping)
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # Allow to DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow to PostgreSQL
  - to:
    - namespaceSelector:
        matchLabels:
          name: database
    ports:
    - protocol: TCP
      port: 5432
  # Allow external HTTPS (for external APIs)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32  # AWS metadata service
    ports:
    - protocol: TCP
      port: 443

---
# Network Policy for Web Frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: novossh-web-netpol
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: novossh
      app.kubernetes.io/component: web
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from Ingress Controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
  egress:
  # Allow to DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow to API server
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: novossh
          app.kubernetes.io/component: api
    ports:
    - protocol: TCP
      port: 8787
