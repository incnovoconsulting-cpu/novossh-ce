---
# Sealed Secrets template for NovoSSH Secrets
# Note: This is a template - values must be base64 encoded
# Use `kubectl create secret` or sealed-secrets in production
apiVersion: v1
kind: Secret
metadata:
  name: novossh-secrets
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database connection string - MUST BE SET IN PRODUCTION
  # Format: postgres://user:password@host:port/database
  DATABASE_URL: "postgres://novossh_user:CHANGE_ME_PASSWORD@postgres-primary.database.svc.cluster.local:5432/novossh?sslmode=require"

  # JWT Configuration - MUST BE GENERATED IN PRODUCTION
  # Generate with: openssl rand -base64 32
  JWT_SECRET: "CHANGE_ME_GENERATE_WITH_openssl_rand_base64_32"

  # BCRYPT Cost Factor
  BCRYPT_COST: "12"

  # Session Timeout (milliseconds)
  SESSION_TIMEOUT: "86400000"

  # TLS/SSL Certificates for database (if needed)
  # These should be mounted from a Kubernetes Secret or ConfigMap
  # DB_SSL_CERT_PATH: "/etc/secrets/db-tls/tls.crt"
  # DB_SSL_KEY_PATH: "/etc/secrets/db-tls/tls.key"
  # DB_SSL_CA_PATH: "/etc/secrets/db-tls/ca.crt"

---
# Secret for TLS/SSL Database Certificates
apiVersion: v1
kind: Secret
metadata:
  name: novossh-db-tls
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: database-tls
type: kubernetes.io/tls
data:
  # These are base64 encoded PEM files
  # tls.crt: LS0tLS1CRUdJTi... (base64 encoded certificate)
  # tls.key: LS0tLS1CRUdJTi... (base64 encoded private key)
  ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUN... # base64 encoded CA certificate

---
# Secret for JWT and Security Keys
apiVersion: v1
kind: Secret
metadata:
  name: novossh-jwt-keys
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: security
type: Opaque
stringData:
  # JWT Signing Key (256-bit minimum)
  jwt-signing-key: "CHANGE_ME_GENERATE_WITH_openssl_rand_hex_32"

  # Optional: JWT Refresh Token Secret
  jwt-refresh-secret: "CHANGE_ME_GENERATE_WITH_openssl_rand_hex_32"

---
# Secret for SSH Keys (for automated deployments)
apiVersion: v1
kind: Secret
metadata:
  name: novossh-ssh-keys
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: deployment
type: kubernetes.io/ssh-auth
data:
  # SSH private key for automated deployments (base64 encoded)
  ssh-privatekey: LS0tLS1CRUdJTi... # base64 encoded SSH private key

---
# Secret for Docker Registry Authentication (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: novossh-registry-credentials
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: registry
type: kubernetes.io/dockercfg
data:
  .dockercfg: eyJhdXRocyI6IHsuLi59fQ== # base64 encoded docker config

---
# Secret for Backup Encryption
apiVersion: v1
kind: Secret
metadata:
  name: novossh-backup-encryption
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  # Encryption key for backups (32 bytes)
  backup-encryption-key: "CHANGE_ME_GENERATE_WITH_openssl_rand_hex_32"

  # Backup access key (if using S3/Cloud Storage)
  backup-access-key: "CHANGE_ME_AWS_ACCESS_KEY_OR_SIMILAR"
  backup-secret-key: "CHANGE_ME_AWS_SECRET_KEY_OR_SIMILAR"

---
# Secret for Monitoring and Observability
apiVersion: v1
kind: Secret
metadata:
  name: novossh-monitoring
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: monitoring
type: Opaque
stringData:
  # Datadog API Key (if using Datadog)
  datadog-api-key: "CHANGE_ME_DATADOG_API_KEY"

  # New Relic License Key (if using New Relic)
  newrelic-license-key: "CHANGE_ME_NEW_RELIC_LICENSE_KEY"

  # Sentry DSN (if using Sentry)
  sentry-dsn: "https://CHANGE_ME_SENTRY_KEY@sentry.io/PROJECT_ID"

  # Custom error tracking endpoint key
  error-tracking-api-key: "CHANGE_ME_ERROR_TRACKING_KEY"

---
# Secret for WAF and Security
apiVersion: v1
kind: Secret
metadata:
  name: novossh-security
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: security
type: Opaque
stringData:
  # API Keys for security services
  waf-api-key: "CHANGE_ME_WAF_API_KEY"
  ddos-protection-key: "CHANGE_ME_DDOS_PROTECTION_KEY"

---
# Secret for CORS and API Keys
apiVersion: v1
kind: Secret
metadata:
  name: novossh-api-keys
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Internal API keys for service-to-service communication
  internal-api-key: "CHANGE_ME_INTERNAL_API_KEY"

  # Third-party API keys (if needed)
  external-api-key: "CHANGE_ME_EXTERNAL_API_KEY"

---
# Secret for Email and Notifications (Phase 4)
apiVersion: v1
kind: Secret
metadata:
  name: novossh-notifications
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: notifications
type: Opaque
stringData:
  # SMTP Configuration for email notifications
  smtp-host: "CHANGE_ME_SMTP_HOST"
  smtp-port: "587"
  smtp-username: "CHANGE_ME_SMTP_USERNAME"
  smtp-password: "CHANGE_ME_SMTP_PASSWORD"

  # Slack webhook (if using Slack notifications)
  slack-webhook-url: "CHANGE_ME_SLACK_WEBHOOK_URL"

  # PagerDuty integration key
  pagerduty-integration-key: "CHANGE_ME_PAGERDUTY_KEY"
