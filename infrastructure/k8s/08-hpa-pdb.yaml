---
# Horizontal Pod Autoscaler for API Server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: novossh-api-hpa
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: novossh-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  # CPU-based autoscaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory-based autoscaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  # Custom metrics (if available from Prometheus)
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max

---
# Horizontal Pod Autoscaler for Web Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: novossh-web-hpa
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: novossh-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
  # CPU-based autoscaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  # Memory-based autoscaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30

---
# Pod Disruption Budget for API Server
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: novossh-api-pdb
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: novossh
      app.kubernetes.io/component: api
  unhealthyPodEvictionPolicy: AlwaysAllow

---
# Pod Disruption Budget for Web Frontend
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: novossh-web-pdb
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
    app.kubernetes.io/component: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novossh
      app.kubernetes.io/component: web
  unhealthyPodEvictionPolicy: AlwaysAllow

---
# Vertical Pod Autoscaler (VPA) - Optional for automatic resource recommendations
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: novossh-api-vpa
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: novossh-api
  updatePolicy:
    updateMode: "Auto"  # Can be "Off", "Initial", "Recreate", "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: novossh-api
      minAllowed:
        cpu: 250m
        memory: 256Mi
      maxAllowed:
        cpu: 4000m
        memory: 4Gi
      # Control memory scaling
      controlledResources: ["cpu", "memory"]
      # Prevent scaling of certain resources if needed
      # controlledValues: RequestsAndLimits

---
# Network Policy for DDoS Protection (rate limiting at pod level)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: novossh-api-rate-limit
  namespace: novossh
  labels:
    app.kubernetes.io/name: novossh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: novossh
      app.kubernetes.io/component: api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8787
