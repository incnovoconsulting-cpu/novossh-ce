name: NovoSSH
options:
  bundleIdPrefix: app.novossh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.11.11"
    CURRENT_PROJECT_VERSION: "76"
    DEVELOPMENT_TEAM: "D88V8CHA63"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.7.0"
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "125.0.0"

targets:
  NovoSSH:
    type: application
    platform: iOS
    sources:
      - path: NovoSSH
        excludes:
          - LaunchScreen.storyboard
    info:
      path: NovoSSH/Info.plist
      properties:
        CFBundleDisplayName: NovoSSH
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSLocalNetworkUsageDescription: "NovoSSH connects to hosts on your local network when you configure them."
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Use Face ID to unlock NovoSSH and protect your SSH credentials."
        NSCameraUsageDescription: "NovoSSH uses WebRTC to set up peer-to-peer sync sessions between your devices. WebRTC's data-channel setup can reference camera APIs internally, but NovoSSH never accesses or records camera data."
        NSMicrophoneUsageDescription: "NovoSSH uses WebRTC to set up peer-to-peer sync sessions between your devices. WebRTC's data-channel setup can reference microphone APIs internally, but NovoSSH never accesses or records microphone data."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - novossh
            CFBundleURLName: com.novossh.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.novossh.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": NovoSSH.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": NovoSSH.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": NovoSSH-macOS.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "NovoSSH AppStore v2"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": "NovoSSH MacCatalyst AppStore"
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: WebRTC
      - sdk: LocalAuthentication.framework
      - sdk: Security.framework
